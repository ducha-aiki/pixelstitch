name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # nbdev 2.x (settings.ini layout) needs era-matching execnb/fastcore;
          # the canned fastai/workflows/quarto-ghp action lacks these pins and breaks
          pip install -e . "nbdev<3" "execnb<0.2" "fastcore<2"
      - name: Build docs
        run: nbdev_docs
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_docs
