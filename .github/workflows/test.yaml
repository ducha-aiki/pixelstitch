name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            python-version: "3.9"
            # matplotlib-inline >=0.2 needs mpl.__version_info__ (mpl >=3.6)
            pins: '"matplotlib~=3.4.3" "numpy<2" "matplotlib-inline==0.1.6"'
          - name: modern
            python-version: "3.12"
            pins: ''
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # nbdev 2.x (settings.ini layout) needs era-matching execnb/fastcore
          pip install -e . "nbdev<3" "execnb<0.2" "fastcore<2" jupyter ipympl ${{ matrix.pins }}
      - name: Notebooks clean and in sync with library
        # Generated-file markers differ between nbdev minor versions, so run
        # the sync check only on the leg whose nbdev matches the committed files.
        if: matrix.name == 'modern'
        run: |
          nbdev_export
          nbdev_clean
          git diff --exit-code
      - name: Run notebook tests
        env:
          MPLBACKEND: Agg
        run: nbdev_test
